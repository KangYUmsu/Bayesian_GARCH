name: bayesian-garch
channels: [conda-forge]
dependencies:
  - python=3.12
  - numpy=1.26.4
  - scipy=1.12.0
  - pandas=2.2.2
  - numba=0.59.1
  - arviz=0.21.0
  - statsmodels=0.14.2
  - matplotlib=3.8.4
  - pytest=7.4.4
  - jupyter
  - nbformat=5.9.2
  - nbclient=0.8.0
  - nbconvert=7.10.0
  - ipykernel
  # rebuilding the PDFs additionally needs a LaTeX distribution with pdflatex, BibTeX, natbib, beamer, tikz (e.g. TeX Live 2025)
  # optional, only to (re)download market data: yfinance
